# Minimal Dovecot 2.4 config for verification. Not a deployment example.
#
# Its job is to make the built packages exercise AL2023's libraries: OpenSSL on
# the IMAPS port, with a restrictive cipher list and SNI so more than the
# defaults are used; Xapian through fts_flatcurve when imaptest issues BODY and
# TEXT searches; libicu through the normalizer-icu filter; and Pigeonhole on
# both the LMTP delivery path and ManageSieve.
# @VERSION@ is substituted by verify/run.sh.

dovecot_config_version = @VERSION@
dovecot_storage_version = @VERSION@

protocols {
  imap = yes
  lmtp = yes
  sieve = yes
}

# LMTP is what imaptest's profile mode delivers over
postmaster_address = postmaster@example.com

# Run Sieve on every LMTP delivery, the way a real deployment does. On its own
# sieve-test proves the interpreter works; this proves it is actually wired
# into the delivery path.
protocol lmtp {
  mail_plugins {
    sieve = yes
  }
}

# Global before-script, applied to every delivery with no per-user script.
sieve_script before1 {
  type = before
  path = /etc/dovecot/sieve/lmtp-before.sieve
}

# Per-user script storage, which is what ManageSieve reads and writes.
sieve_script personal {
  path = ~/sieve
  active_path = ~/.dovecot.sieve
}

listen = 127.0.0.1
log_path = /dev/stderr

mail_driver = maildir
mail_home = /var/vmail/%{user}
mail_path = ~/Maildir
mail_uid = vmail
mail_gid = vmail
first_valid_uid = 500

namespace inbox {
  inbox = yes
  separator = /

  # Autocreated special-use mailboxes. Exercises the autocreate path and the
  # RFC 6154 flags, which imaptest sees in its LIST. create rather than
  # subscribe: autosubscribing rewrites one shared subscriptions file, and
  # imaptest's four clients LIST hard enough to contend on it.
  mailbox Drafts {
    auto = create
    special_use = \Drafts
  }
  mailbox "Sent Items" {
    auto = create
    special_use = \Sent
  }
  mailbox "Deleted Items" {
    auto = create
    special_use = \Trash
  }
  mailbox "Junk Email" {
    auto = create
    special_use = \Junk
  }
}

passdb testfile {
  driver = passwd-file
  passwd_file_path = /etc/dovecot/test-users
}
userdb testfile {
  driver = passwd-file
  passwd_file_path = /etc/dovecot/test-users
}

# OpenSSL: AL2023 has 3.5.5 where the Dovecot project's EL9 build has 3.0.x.
# required, a floor and an explicit cipher list rather than plain "ssl = yes":
# a restrictive list is what makes AL2023's OpenSSL parse and apply one.
ssl = required
ssl_min_protocol = TLSv1.2
ssl_cipher_list = TLS_AES_256_GCM_SHA384:TLS_AES_128_GCM_SHA256:TLS_CHACHA20_POLY1305_SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-CHACHA20-POLY1305
ssl_server_prefer_ciphers = server
ssl_server {
  cert_file = /etc/dovecot/test.crt
  key_file = /etc/dovecot/test.key
}

# SNI. imaptest passes its host= through as the TLS servername, and
# openssl s_client -servername proves which certificate came back. Both certs
# are self-signed by run.sh, so this needs nothing provisioned.
local_name imap-sni.example.com {
  ssl_server_cert_file = /etc/dovecot/test-sni.crt
  ssl_server_key_file = /etc/dovecot/test-sni.key
}

service imap-login {
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 993
  }
}

# Port 24 matches lmtp_port in verify/imaptest-profile.conf.
service lmtp {
  inet_listener lmtp {
    port = 24
  }
}

service managesieve-login {
  inet_listener sieve {
    port = 4190
  }
}

# Xapian: the one SPAL dependency, and the reason this project exists. imaptest
# issues BODY and TEXT searches, which route through this backend.
mail_plugins {
  fts = yes
  fts_flatcurve = yes
}

fts flatcurve {
}

# Off deliberately. fts_autoindex is what runs indexer-worker during APPEND and
# EXPUNGE, and indexer-worker is the process that takes Xapian's lock before the
# Maildir uidlist lock while everything else takes them the other way round -
# the deadlock in §3 of REQUIREMENTS.md. Without it, indexing happens in the
# searching process instead, so no two processes take the pair in both orders.
# Searches still have to use the index, because the fallback below is off.
fts_autoindex = no

# Without this, a failed FTS lookup silently falls back to a non-indexed search
# and returns the right answer anyway - so a broken Xapian would pass. The
# whole point of verifying against AL2023's Xapian is that it must fail loudly.
fts_search_read_fallback = no

language en {
  language_default = yes
  language_filters {
    normalizer-icu = yes
    lowercase = yes
    snowball = yes
    stopwords = yes
  }
  language_tokenizers {
    generic = yes
    email-address = yes
  }
}
