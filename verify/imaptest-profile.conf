# imaptest profile for the LMTP half of the verification. Not a deployment
# example, and not a load profile - the numbers are the smallest ones that
# still make imaptest deliver and then notice the delivery.
#
# Profile mode is the only mode in which imaptest speaks LMTP. It delivers to
# each user's INBOX over LMTP, then drives that user's IMAP session, so a
# delivery that never lands shows up as an IMAP session that never sees the
# EXISTS it was told to expect. imaptest does all of that itself; the only
# thing this file does is describe the one user and one client to do it with.
#
# lmtp_port must match the inet_listener in verify/dovecot.conf.

lmtp_port = 24
total_user_count = 1
rampup_time = 0s

# The single account verify/run.sh provisions. count must total 100%.
user testuser {
  count = 100%
  username_format = test@example.com

  # Deliver over LMTP this often. Everything else a profile can simulate -
  # spam-folder delivery via plus-addressing, users writing mail, sessions
  # ending - is off, so the only traffic is INBOX deliveries and the IMAP
  # reaction to them.
  mail_inbox_delivery_interval = 2s
  mail_spam_delivery_interval = 0
  mail_send_interval = 0
  mail_session_length = 0

  # React to a delivered message, but never destroy it: the run should leave
  # the mailbox as it found it apart from what LMTP added.
  mail_action_delay = 1s
  mail_action_repeat_delay = 1s
  mail_inbox_reply_percentage = 0
  mail_inbox_delete_percentage = 0
  mail_inbox_trash_percentage = 0
  mail_inbox_move_percentage = 0
  mail_inbox_move_filter_percentage = 0
}

# One IDLEing IMAP client, so a delivery is noticed as an unsolicited EXISTS
# rather than found by polling. imap_fetch_immediate and imap_fetch_manual are
# the FETCH items imaptest uses on notification and on follow-up; both are
# interpolated into a FETCH command, so neither can be left unset.
client desktop {
  count = 100%
  protocol = imap
  connection_max_count = 1
  imap_idle = yes
  imap_fetch_immediate = UID FLAGS RFC822.SIZE
  imap_fetch_manual = BODY.PEEK[]
}
