name: Verify
# Installs the RPMs a Build run produced and does basic checks to verify they work

on:
  workflow_run:
    workflows: [Build]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Build run ID whose RPMs to test'
        required: true

permissions:
  actions: read
  contents: read

jobs:
  verify:
    # Do not test the artifacts of a build that failed.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - id: build
        run: echo "run_id=${{ github.event.workflow_run.id || inputs.run_id }}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        with:
          name: rpms-${{ matrix.arch }}
          path: rpms
          run-id: ${{ steps.build.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Install the RPMs and start dovecot
        run: |
          # SYS_PTRACE so the stall diagnostics can take a backtrace of a stuck
          # process. Not needed to serve mail.
          docker run -d --name dovecot --network host \
            --cap-add=SYS_PTRACE \
            -v "$PWD:/w" -w /w \
            public.ecr.aws/amazonlinux/amazonlinux:2023 \
            ./verify/run.sh /w/rpms
          for port in 993 24 4190; do
            for i in $(seq 1 60); do
              (exec 3<>/dev/tcp/127.0.0.1/$port) 2>/dev/null && break
              if [ "$i" = 60 ]; then
                docker logs dovecot
                echo "dovecot never listened on $port"
                exit 1
              fi
              sleep 2
            done
          done
          docker logs dovecot

      # Concurrency and FTS writes are deliberately never combined: together
      # they hit the flatcurve/Maildir lock-order deadlock in §3 of
      # REQUIREMENTS.md, which wedges the server about half the time. Four
      # clients here, with SEARCH left at its default probability of 0, so
      # nothing writes the Xapian index while they run.
      - name: imaptest over TLS (concurrent)
        run: |
          curl -fsSL -o dovecot-crlf https://dovecot.org/tmp/dovecot-crlf
          docker run --rm --network host -v "$PWD/dovecot-crlf:/mbox:ro" \
            dovecot/imaptest \
            host=127.0.0.1 port=993 ssl=any-cert \
            user=test@example.com pass=testpass \
            mbox=/mbox \
            clients=4 msgs=50 secs=90 \
            error_quit disconnect_quit

      # The Xapian half, single-client so there is no second process to invert
      # the locks against. search=30 is what makes it exercise Xapian at all:
      # imaptest's SEARCH state has a default probability of 0, so without it
      # not one SEARCH is ever sent. The searches are BODY and TEXT terms built
      # from the body words imaptest tracked, checked against what comes back.
      - name: imaptest SEARCH through Xapian (single client)
        run: |
          docker run --rm --network host -v "$PWD/dovecot-crlf:/mbox:ro" \
            dovecot/imaptest \
            host=127.0.0.1 port=993 ssl=any-cert \
            user=test@example.com pass=testpass \
            mbox=/mbox \
            clients=1 msgs=50 secs=60 \
            search=50 \
            error_quit disconnect_quit

      # user= is required even though the profile names the user itself:
      # imaptest checks for it before it reads the profile, then ignores it.
      - name: imaptest LMTP delivery (profile mode)
        run: |
          docker run --rm --network host \
            -v "$PWD/dovecot-crlf:/mbox:ro" \
            -v "$PWD/verify/imaptest-profile.conf:/profile.conf:ro" \
            dovecot/imaptest \
            host=127.0.0.1 port=993 ssl=any-cert \
            user=test@example.com pass=testpass \
            mbox=/mbox \
            profile=/profile.conf \
            secs=30 \
            error_quit disconnect_quit
          # Sieve ran inside the delivery path, not just standalone.
          docker exec dovecot doveadm search -u test@example.com \
            mailbox LmtpSieved all | grep -q . \
            || { echo "LMTP delivered but the sieve_before script did not run"; exit 1; }

      - name: Sieve routing (sieve-test)
        run: |
          docker exec dovecot sieve-test -e -u test@example.com \
            -c /etc/dovecot/dovecot.conf \
            /w/verify/sieve-test.sieve /w/verify/sieve-test-mail.eml
          found=$(docker exec dovecot doveadm search -u test@example.com \
            mailbox Sieved subject SIEVE-VERIFY)
          [ -n "$found" ] || { echo "sieve-test ran but the message is not in Sieved"; exit 1; }

      # SNI: the servername picks the certificate. Both are self-signed by
      # run.sh, so this needs nothing provisioned.
      - name: TLS SNI certificate selection
        run: |
          subject_for() {
            openssl s_client -connect 127.0.0.1:993 ${1:+-servername "$1"} \
              </dev/null 2>/dev/null | openssl x509 -noout -subject
          }
          default=$(subject_for "")
          sni=$(subject_for imap-sni.example.com)
          echo "default: $default"
          echo "sni:     $sni"
          case $default in *localhost*) ;; *) echo "default cert is not CN=localhost"; exit 1 ;; esac
          case $sni in *imap-sni.example.com*) ;; *) echo "SNI did not select the local_name cert"; exit 1 ;; esac

      # ManageSieve, over STARTTLS because ssl = required.
      - name: ManageSieve script upload
        run: |
          auth=$(printf '\0test@example.com\0testpass' | base64 -w0)
          resp=$(printf 'AUTHENTICATE "PLAIN" "%s"\r\nPUTSCRIPT "verify-managesieve" {5+}\r\nkeep;\r\nLISTSCRIPTS\r\nLOGOUT\r\n' "$auth" \
            | openssl s_client -quiet -connect 127.0.0.1:4190 -starttls sieve 2>/dev/null)
          echo "$resp"
          echo "$resp" | grep -q 'verify-managesieve' \
            || { echo "PUTSCRIPT/LISTSCRIPTS did not round-trip over ManageSieve"; exit 1; }

      # A stalled imaptest run reports nothing server-side: dovecot logs are
      # silent because nothing errors, it just stops making progress. wchan
      # says whether the processes are blocked in the kernel (a lock) or
      # running, which is the difference between a deadlock and slowness.
      - name: Diagnose a stall
        if: failure()
        run: |
          echo "=== dovecot processes: state, kernel wait channel, elapsed ==="
          docker exec dovecot ps -eo pid,stat,wchan:24,etime,args || true
          echo "=== lock files under the mail store and fts index ==="
          docker exec dovecot find /var/vmail -name '*lock*' -printf '%p %s %TT\n' || true
          echo "=== fts index tree ==="
          docker exec dovecot find /var/vmail -path '*fts*' -maxdepth 6 | head -40 || true
          # The debuginfo packages are already installed, so this resolves to
          # real frames: it says whether the worker is wedged inside Xapian,
          # inside glibc, or in Dovecot's own locking.
          echo "=== backtrace of every stuck dovecot process ==="
          docker exec dovecot dnf -y -q install gdb >/dev/null 2>&1 || true
          for name in indexer-worker indexer imap lmtp; do
            for pid in $(docker exec dovecot pgrep -f "dovecot/$name" || true); do
              echo "--- $name pid $pid ---"
              docker exec dovecot timeout 60 gdb -p "$pid" -batch \
                -ex 'thread apply all bt' 2>&1 | grep -vE '^\[|Reading symbols|^$' | head -40 || true
            done
          done

      # What AL2023 actually supplies underneath these packages. The rebuild's
      # risk surface is exactly where these differ from the EL9 versions the
      # Dovecot project builds its own RPMs against, so the list is worth
      # having in the log of every run.
      - name: Linked library inventory
        if: always()
        run: |
          docker exec -i dovecot bash -s <<'EOF'
          # Every daemon and every module under %{_libdir}/dovecot, not just the
          # ones linked into the main binary. OpenSSL in particular is reached
          # only through a dlopened iostream module, so a plain ldd of
          # /usr/sbin/dovecot does not show the largest version delta of the lot.
          {
            for f in /usr/sbin/dovecot /usr/libexec/dovecot/*; do
              [ -f "$f" ] && [ -x "$f" ] && ldd "$f"
            done
            find /usr/lib64/dovecot -name '*.so*' -type f -exec ldd {} +
          } 2>/dev/null \
            | sed -n 's/.*=> \(\/[^ ]*\).*/\1/p' \
            | grep -v '^/usr/lib/debug' | sort -u \
            | while read -r lib; do
                pkg=$(rpm -qf --qf '%{NAME}-%{VERSION}-%{RELEASE}' "$lib" 2>/dev/null) || pkg='(not owned)'
                case $pkg in dovecot-*|dovecot) continue ;; esac
                printf '%-34s %s\n' "$(basename "$lib")" "$pkg"
              done | sort -u
          EOF

      - name: dovecot log
        if: always()
        run: docker logs dovecot
